<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#d5382a">
<title>Japan 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<style>
  :root{
    --bg:#f0eeea;
    --ink:#444241; --on-ink:#f5f1ea; --on-ink-muted:rgba(245,241,234,.55);
    --paper:#ffffff; --on-paper:#444241; --on-paper-muted:rgba(68,66,65,.5);
    --red:#d5382a; --on-red:#fff8f4;
    --line-on-paper: rgba(68,66,65,.08);
    --line-on-ink: rgba(68,66,65,.08);
    --shadow: 0 2px 12px rgba(68,66,65,.06);

    --tokyo:#3F5AA9; --nagoya:#8F6A17; --kyoto:#8E0E23; --onsen:#166B57; --fuji:#2C6E9E; --transit:#6b5c5a;

    --r-tile:30px; --r-sm:16px; --r-pill:999px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{ height:100%; }
  body{
    margin:0; font-family:'Figtree',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--on-paper); overscroll-behavior-y:none;
  }
  .hebrew{ direction:rtl; unicode-bidi:isolate; }
  a{ color:inherit; text-decoration:none; }

  .msy{ font-family:'Material Symbols Rounded'; font-weight:400; font-style:normal; font-size:20px; line-height:1;
    letter-spacing:normal; text-transform:none; white-space:nowrap; word-wrap:normal; direction:ltr;
    -webkit-font-feature-settings:'liga'; font-feature-settings:'liga'; -webkit-font-smoothing:antialiased;
    display:inline-flex; align-items:center; justify-content:center; vertical-align:middle; flex-shrink:0;
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;
    user-select:none; }
  .dot{ font-family:'Figtree',sans-serif; font-weight:800; }

  .ripple-host{ position:relative; overflow:hidden; }
  .ripple{ position:absolute; border-radius:50%; background:currentColor; opacity:.18; transform:scale(0);
    animation:rippleAnim .5s ease-out forwards; pointer-events:none; }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }

  .app{ max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative; }

  /* ---- header ---- */
  .app-header{ padding: calc(16px + var(--safe-top)) 18px 6px; display:flex; align-items:center; justify-content:space-between; }
  .app-header .brand{ display:flex; align-items:center; gap:9px; font-size:19px; font-weight:700; }
  .app-header .brand .msy{ font-size:20px; }
  .app-header .daybadge{ font-family:'Figtree',sans-serif; font-size:13px; font-weight:700; background:var(--paper); color:var(--on-paper); padding:7px 14px; border-radius:var(--r-pill); letter-spacing:.5px; box-shadow:var(--shadow); }
  .app-sub{ padding: 0 18px 14px; font-size:13px; color:var(--on-paper-muted); font-weight:500; }

  /* ---- views ---- */
  .view{ flex:1; padding: 4px 16px calc(120px + var(--safe-bottom)); display:none; }
  .view.active{ display:block; }

  /* ---- bento grid (Today) ---- */
  .bento{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .t-c2{ grid-column:span 2; } .t-c4{ grid-column:span 4; }
  .tile{ border-radius:var(--r-tile); padding:16px; display:flex; flex-direction:column; justify-content:space-between; min-height:96px; background:var(--paper); color:var(--on-paper); box-shadow:var(--shadow); }
  .tile.dark,.tile.light{ background:var(--paper); color:var(--on-paper); }
  .tile.ink{ background:var(--ink); color:var(--on-ink); box-shadow:none; }
  .tile.red{ background:var(--red); color:var(--on-red); box-shadow:none; }
  .tile.circle{ border-radius:50%; aspect-ratio:1; align-items:center; text-align:center; }
  .tile .eyebrow{ font-size:10.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; opacity:.6; display:flex; align-items:center; gap:5px; }
  .tile .big{ font-family:'Figtree',sans-serif; font-weight:800; font-size:30px; line-height:1.05; margin-top:8px; letter-spacing:-.5px; }
  .tile .big.sm{ font-size:22px; }
  .tile .caption{ font-size:12px; margin-top:6px; opacity:.75; font-weight:500; }
  .tile .icon-lead{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:rgba(68,66,65,.06); margin-bottom:8px; }
  .tile.light .icon-lead{ background:rgba(68,66,65,.06); }

  .countdown-num{ font-family:'Figtree',sans-serif; font-weight:800; font-size:52px; line-height:1; margin-top:6px; letter-spacing:-1px; }

  .section-title{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--on-paper-muted); margin:22px 2px 10px; display:flex; align-items:center; gap:6px; }

  /* ---- day / list cards ---- */
  .card{ border-radius:var(--r-tile); padding:18px; margin-bottom:12px; background:var(--paper); color:var(--on-paper); box-shadow:var(--shadow); }
  .card.dark,.card.light{ background:var(--paper); color:var(--on-paper); }
  .card-top{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-areas:
      "date day"
      "route tags";
    column-gap:14px;
    row-gap:8px;
    align-items:center;
  }
  .date-main{ grid-area:date; line-height:1; align-self:center; }
  .daynum{
    grid-area:day;
    justify-self:end;
    align-self:center;
    display:inline-flex;
    align-items:center;
    line-height:1;
    font-family:'Figtree',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.5px;
    padding:5px 11px;
    border-radius:var(--r-pill);
    background:rgba(68,66,65,.06);
    color:var(--on-paper);
  }
  .card.dark .daynum,.card.light .daynum{ background:rgba(68,66,65,.06); color:var(--on-paper); }
  .date-main{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.55; }
  .card.dark .date-main{ opacity:.55; }
  .date-sub{ font-size:11.5px; margin-top:1px; opacity:.55; font-weight:500; text-transform:uppercase; letter-spacing:.4px; }
  .tags{ grid-area:tags; justify-self:end; align-self:center; display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; align-items:center; }
  .tag{ font-size:10.5px; padding:5px 10px 5px 8px; border-radius:var(--r-pill); font-weight:700; background:var(--ink); color:var(--on-ink); display:inline-flex; align-items:center; gap:3px; text-transform:uppercase; letter-spacing:.3px; line-height:1; }
  .tag .msy{ font-size:13px; }
  .route-line{ grid-area:route; min-width:0; align-self:center; margin-top:-2px; font-size:23.8px; font-weight:800; line-height:1.15; letter-spacing:-.3px; }
  .route-line .arrow{ opacity:.4; font-weight:400; padding:0 4px; }
  .card-body{ margin-top:14px; display:flex; flex-direction:column; }
  .card-section{ border-top:1px solid var(--line-on-paper); }
  .card-section:first-child{ border-top:none; }
  .section-toggle{ padding:11px 0; }
  .section-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; opacity:.5; }

  /* ---- shared collapse ---- */
  .collapse-panel{ overflow:hidden; }
  .collapse-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:10px; background:none; border:none; cursor:pointer; font-family:inherit; color:inherit; text-align:left; }
  .collapse-chevron{ font-size:20px; opacity:.4; transition:transform 150ms cubic-bezier(0.6,0,1,1); flex-shrink:0; }
  .collapse-content{ display:grid; grid-template-rows:0fr; transition:grid-template-rows 150ms cubic-bezier(0.6,0,1,1); }
  .collapse-panel.open > .collapse-content{ grid-template-rows:1fr; transition:grid-template-rows 250ms cubic-bezier(0,0,0.2,1); }
  .collapse-inner{ overflow:hidden; min-height:0; }
  .collapse-panel > .collapse-content > .collapse-inner > .collapse-slide{ opacity:0; transform:translateY(-8px); transition:opacity 150ms cubic-bezier(0.6,0,1,1), transform 150ms cubic-bezier(0.6,0,1,1); transition-delay:0s; }
  .collapse-panel.open > .collapse-content > .collapse-inner > .collapse-slide{ opacity:1; transform:translateY(0); transition:opacity 250ms cubic-bezier(0,0,0.2,1), transform 250ms cubic-bezier(0,0,0.2,1); transition-delay:.04s; }
  .collapse-panel.open > .collapse-toggle .collapse-chevron{ transform:rotate(180deg); transition:transform 250ms cubic-bezier(0,0,0.2,1); }
  .card-section .collapse-slide > .value{ padding-bottom:12px; font-size:13.5px; }
  .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; padding-top:2px; font-weight:700; opacity:.5; }
  .value .en{ line-height:19px; font-weight:500; }
  .value .he.hebrew{ font-size:12.5px; margin-top:2px; opacity:.6; direction:rtl; unicode-bidi:plaintext; text-align:left; display:block; }
  .transport-badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px 4px 6px; border-radius:var(--r-pill); font-size:12px; font-weight:600; background:rgba(68,66,65,.06); }
  .card.dark .transport-badge,.card.light .transport-badge{ background:rgba(68,66,65,.06); }
  .transport-badge .msy{ font-size:16px; opacity:.7; }
  .places{ display:flex; flex-wrap:wrap; gap:6px; margin-top:7px; }
  .place-link{ display:inline-flex; align-items:center; gap:3px; font-size:11.5px; font-weight:600; padding:4px 9px 4px 6px; border-radius:var(--r-pill); background:rgba(68,66,65,.06); }
  .card.dark .place-link,.card.light .place-link{ background:rgba(68,66,65,.06); }
  .place-link .msy{ font-size:14px; }
  .note-line{ font-size:12.5px; line-height:17px; padding:9px 12px; border-radius:var(--r-sm); margin-top:12px; display:flex; gap:7px; align-items:flex-start; background:rgba(68,66,65,.06); color:var(--on-paper); font-weight:600; }
  .note-line.alert{ background:var(--red); color:var(--on-red); }
  .note-line .msy{ font-size:16px; flex-shrink:0; margin-top:1px; line-height:1; }
  .note-line span:last-child{ flex:1; min-width:0; }
  .day-context{ font-size:12.5px; line-height:1.55; margin-top:12px; padding:12px 14px; border-radius:var(--r-sm); font-weight:500; background:rgba(68,66,65,.04); color:var(--on-paper); }
  .card.light .day-context,.card.dark .day-context{ background:rgba(68,66,65,.04); color:var(--on-paper); }
  .day-context.hebrew{ direction:rtl; unicode-bidi:plaintext; text-align:right; }
  .hotel-mini{ display:flex; align-items:center; gap:10px; }
  .hotel-mini img{ width:42px; height:42px; border-radius:50%; object-fit:cover; flex-shrink:0; background:rgba(120,120,120,.2); }
  .hotel-mini .ph-fallback{ width:42px; height:42px; border-radius:50%; display:none; align-items:center; justify-content:center; flex-shrink:0; background:var(--ink); color:var(--on-ink); }
  .hotel-mini .ph-fallback .msy{ font-size:20px; }
  .hotel-mini .htxt b{ display:block; font-size:13px; font-weight:700; }
  .hotel-mini .htxt span{ font-size:11px; opacity:.6; font-weight:500; }

  /* ---- nav arrows (Today) ---- */
  .nav-arrows{ display:flex; gap:10px; margin-top:12px; }
  .nav-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:7px; background:var(--ink); color:var(--on-ink);
    border:none; border-radius:var(--r-pill); padding:14px; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; cursor:pointer; font-family:inherit; box-shadow:var(--shadow); }
  .nav-btn[disabled]{ opacity:.3; pointer-events:none; }

  /* ---- search + filter ---- */
  .controls{ display:flex; align-items:stretch; gap:8px; margin: 10px 0 14px; }
  .search-field{ display:flex; align-items:center; gap:10px; background:var(--paper); color:var(--on-paper); border-radius:var(--r-pill); padding:13px 18px; box-shadow:var(--shadow); flex:1; min-width:0; }
  .search-field .msy{ opacity:.45; }
  #search{ border:none; background:transparent; outline:none; font-size:14.5px; flex:1; color:var(--on-paper); font-family:inherit; font-weight:500; min-width:0; }
  #search::placeholder{ color:var(--on-paper-muted); }
  .filter-dd{ position:relative; flex-shrink:0; }
  .filter-btn{ height:100%; padding:0 16px; border:none; border-radius:var(--r-pill); background:var(--paper); color:var(--on-paper); box-shadow:var(--shadow); font-family:inherit; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap; }
  .filter-btn .msy{ font-size:18px; }
  .filter-btn .filter-chevron{ font-size:20px; opacity:.45; transition:transform .2s ease; }
  .filter-dd.open .filter-btn .filter-chevron{ transform:rotate(180deg); }
  .filter-btn.has-filter{ background:var(--red); color:var(--on-red); box-shadow:none; }
  .filter-btn.has-filter .filter-chevron{ opacity:.8; }
  .filter-menu{ display:none; position:absolute; right:0; top:calc(100% + 8px); min-width:188px; background:var(--paper); border-radius:22px; box-shadow:0 8px 28px rgba(68,66,65,.14); padding:8px; z-index:30; }
  .filter-dd.open .filter-menu{ display:block; }
  .filter-opt{ width:100%; text-align:left; border:none; background:none; border-radius:14px; padding:11px 12px; font-family:inherit; font-size:13px; font-weight:700; color:var(--on-paper); cursor:pointer; display:flex; align-items:center; gap:8px; }
  .filter-opt.active{ background:var(--red); color:var(--on-red); }
  .filter-opt .rdot{ display:inline-block; width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--ink); }
  .filter-opt.active .rdot{ background:var(--on-red); }
  .filter-sep{ height:1px; background:var(--line-on-paper); margin:6px 8px; }
  .chip{ padding:9px 15px; border-radius:var(--r-pill); background:var(--paper); font-size:12px; font-weight:700; cursor:pointer; color:var(--on-paper-muted); white-space:nowrap; display:inline-flex; align-items:center; gap:6px; text-transform:uppercase; letter-spacing:.3px; flex-shrink:0; border:1px solid transparent; box-shadow:var(--shadow); transition:background .2s ease, color .2s ease, border-color .2s ease, transform .15s ease; scroll-snap-align:start; }
  .chip:active{ transform:scale(.97); }
  .chip.active{ background:var(--red); color:var(--on-red); border-color:transparent; box-shadow:none; }
  .chip#openOnly{ border-color:rgba(68,66,65,.1); }
  .chip#openOnly.active{ background:var(--red); border-color:transparent; }
  .chip .rdot{ display:inline-block; width:7px; height:7px; border-radius:50%; flex-shrink:0; background:var(--ink); }
  .chip.active .rdot{ background:var(--on-red); }

  .chips-wrap{ position:relative; margin-bottom:0; }
  .chips-row{ display:flex; gap:7px; overflow-x:auto; padding:2px 2px 6px; margin-bottom:0; position:relative; scrollbar-width:none; scroll-behavior:smooth; -webkit-overflow-scrolling:touch; scroll-snap-type:x proximity; }
  .chips-wrap::after{ content:''; position:absolute; right:0; top:0; bottom:6px; width:52px; background:linear-gradient(to right,transparent,var(--bg)); pointer-events:none; z-index:1; transition:opacity .35s ease; }
  .chips-wrap.at-end::after,.chips-wrap.no-overflow::after{ opacity:0; }
  .chips-wrap::before{ content:''; position:absolute; left:0; top:0; bottom:6px; width:20px; background:linear-gradient(to left,transparent,var(--bg)); pointer-events:none; z-index:1; opacity:0; transition:opacity .35s ease; }
  .chips-wrap.scrolled::before{ opacity:1; }
  .chips-wrap:not(.at-end):not(.no-overflow)::after{ animation:chipsEdgePulse 2.8s ease-in-out infinite; }
  .chips-row::-webkit-scrollbar{ display:none; }
  @keyframes chipsEdgePulse{ 0%,100%{ opacity:.65; } 50%{ opacity:1; } }

  .route{ display:flex; align-items:center; gap:6px; overflow-x:auto; padding-bottom:12px; margin-bottom:2px; font-size:12px; }
  .route::-webkit-scrollbar{ display:none; }
  .route-leg{ display:flex; align-items:center; gap:5px; padding:8px 13px; border-radius:var(--r-pill); background:var(--paper); color:var(--on-paper); white-space:nowrap; font-weight:700; cursor:pointer; text-transform:uppercase; letter-spacing:.3px; font-size:11px; flex-shrink:0; box-shadow:var(--shadow); }
  .route-arrow{ opacity:.35; font-size:18px; flex-shrink:0; }

  .empty-state{ text-align:center; color:var(--on-paper-muted); font-size:14px; overflow:hidden; }
  .empty-state .collapse-slide{ display:flex; flex-direction:column; align-items:center; gap:10px; padding:48px 0; font-size:14px; }
  .empty-state .msy{ font-size:36px; opacity:.4; }

  /* ---- hotels ---- */
  .hotel-card{ background:var(--paper); border-radius:var(--r-tile); overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow); }
  .hotel-photo{ width:100%; height:180px; object-fit:cover; display:block; background:rgba(68,66,65,.04); filter:none; }
  .hotel-photo-fallback{ width:100%; height:180px; display:none; align-items:center; justify-content:center; background:rgba(68,66,65,.04); color:var(--on-paper-muted); }
  .hotel-photo-fallback .msy{ font-size:40px; }
  .hotel-body{ padding:16px 18px 18px; }
  .hotel-card.collapse-panel > .hotel-body > .collapse-content{ display:grid; grid-template-rows:0fr; transition:grid-template-rows 150ms cubic-bezier(0.6,0,1,1); }
  .hotel-card.collapse-panel.open > .hotel-body > .collapse-content{ grid-template-rows:1fr; transition:grid-template-rows 250ms cubic-bezier(0,0,0.2,1); }
  .hotel-card.collapse-panel > .hotel-body > .collapse-content > .collapse-inner > .collapse-slide{ opacity:0; transform:translateY(-8px); transition:opacity 150ms cubic-bezier(0.6,0,1,1), transform 150ms cubic-bezier(0.6,0,1,1); transition-delay:0s; }
  .hotel-card.collapse-panel.open > .hotel-body > .collapse-content > .collapse-inner > .collapse-slide{ opacity:1; transform:translateY(0); transition:opacity 250ms cubic-bezier(0,0,0.2,1), transform 250ms cubic-bezier(0,0,0.2,1); transition-delay:.04s; }
  .hotel-card.collapse-panel.open .hotel-header .collapse-chevron{ transform:rotate(180deg); }
  .hotel-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; cursor:pointer; }
  .hotel-name{ font-size:16.5px; font-weight:700; display:flex; align-items:center; gap:6px; }
  .hotel-name .msy{ font-size:17px; opacity:.5; }
  .hotel-area{ font-size:12.5px; opacity:.55; margin-top:3px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  .hotel-stays{ margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .stay-range{ font-size:12px; font-family:'Figtree',sans-serif; font-weight:700; background:rgba(68,66,65,.06); padding:7px 12px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:6px; width:fit-content; letter-spacing:.2px; }
  .stay-range .msy{ font-size:15px; opacity:.55; }
  .hotel-actions{ display:flex; gap:10px; margin-top:14px; }
  .btn{ flex:1; text-align:center; padding:12px; border-radius:var(--r-pill); font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; display:flex; align-items:center; justify-content:center; gap:6px; position:relative; overflow:hidden; }
  .btn .msy{ font-size:16px; }
  .btn.primary{ background:var(--ink); color:var(--on-ink); border:none; box-shadow:var(--shadow); }
  .btn.secondary{ background:rgba(68,66,65,.04); color:var(--on-paper); }
  .warn-note{ font-size:11.5px; line-height:16px; font-weight:600; color:var(--on-red); background:var(--red); padding:10px 13px; border-radius:var(--r-sm); margin-top:12px; display:flex; gap:7px; }
  .warn-note .msy{ font-size:17px; flex-shrink:0; }
  .addr{ font-size:12px; opacity:.55; margin-top:10px; display:flex; align-items:center; gap:5px; font-weight:500; }
  .addr .msy{ font-size:16px; }

  /* ---- flights panel ---- */
  .flights-panel{ background:var(--paper); color:var(--on-paper); border-radius:var(--r-tile); margin-bottom:14px; box-shadow:var(--shadow); padding:16px 18px 18px; }
  .flights-panel h3{ margin:0 0 10px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; opacity:.5; display:flex; align-items:center; gap:6px; }
  .flight-leg{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:12.5px; padding:8px 0; border-top:1px solid var(--line-on-paper); }
  .flight-leg:first-of-type{ border-top:none; padding-top:0; }
  .flight-leg .route{ font-weight:700; }
  .flight-leg .meta{ opacity:.55; font-size:11.5px; grid-column:1/-1; }
  .flight-leg .times{ opacity:.75; font-weight:600; white-space:nowrap; }

  /* ---- bottom dock nav ---- */
  .tabbar{
    position:fixed; bottom: calc(14px + var(--safe-bottom)); left:50%; transform:translateX(-50%);
    width: calc(100% - 32px); max-width:488px;
    display:flex; gap:6px; background:var(--paper); border-radius:var(--r-pill); padding:7px;
    z-index:40; box-shadow:0 4px 20px rgba(68,66,65,.1);
  }
  .tab{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:9px 4px;
    background:none; border:none; color:var(--on-paper-muted); font-size:10px; font-weight:700; border-radius:var(--r-pill);
    cursor:pointer; font-family:'Figtree',sans-serif; text-transform:uppercase; letter-spacing:.25px; min-width:0; }
  .tab.active{ background:var(--red); color:var(--on-red); }
  .tab .msy{ font-size:20px; line-height:1; }

  footer.credit{ text-align:center; color:var(--on-paper-muted); font-size:11px; padding:6px 0 4px; }

  /* ---- essentials ---- */
  .essentials-subnav{ margin:6px 0 14px; }
  .essentials-subnav .chip{ font-size:11px; padding:8px 13px; }
  .ref-bento .tile{ min-height:88px; }
  .ref-list{ font-size:12.5px; line-height:1.55; font-weight:500; margin-top:6px; }
  .ref-list li{ margin-bottom:4px; }
  .phrase-row{ padding:10px 0; border-top:1px solid var(--line-on-paper); }
  .phrase-row:first-child{ border-top:none; padding-top:0; }
  .phrase-ja{ font-size:15px; font-weight:700; margin-top:2px; }
  .phrase-he.hebrew{ font-size:12px; opacity:.6; margin-top:2px; }
  .tonight-actions{ margin-top:10px; }
  .tonight-actions .btn{ flex:none; padding:10px 16px; font-size:11.5px; }

  /* ---- fx calculator ---- */
  .fx-calc{ padding:16px 18px 18px; }
  .fx-calc-hint{ font-size:11px; font-weight:600; color:var(--on-paper-muted); margin-bottom:14px; line-height:1.45; }
  .fx-source{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .fx-source a{ font-size:11px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:.3px; display:inline-flex; align-items:center; gap:4px; }
  .fx-refresh{ font-size:11px; font-weight:700; color:var(--on-paper-muted); background:none; border:none; cursor:pointer; font-family:inherit; text-transform:uppercase; letter-spacing:.3px; display:inline-flex; align-items:center; gap:4px; padding:4px 0; }
  .fx-refresh.loading{ opacity:.45; pointer-events:none; }
  .fx-live{ display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.35px; color:var(--red); margin-bottom:8px; }
  .fx-live .dot-live{ width:7px; height:7px; border-radius:50%; background:var(--red); animation:fxPulse 2s ease-in-out infinite; }
  @keyframes fxPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .fx-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .fx-row:last-of-type{ margin-bottom:0; }
  .fx-label{ width:72px; flex-shrink:0; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; opacity:.55; }
  .fx-input-wrap{ flex:1; display:flex; align-items:center; gap:8px; background:rgba(68,66,65,.04); border-radius:var(--r-pill); padding:4px 14px 4px 16px; border:2px solid transparent; transition:border-color .15s; }
  .fx-input-wrap.focused{ border-color:rgba(213,56,42,.35); background:var(--paper); }
  .fx-symbol{ font-size:15px; font-weight:800; opacity:.45; flex-shrink:0; }
  .fx-input{ flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:18px; font-weight:700; color:var(--on-paper); min-width:0; padding:10px 0; }
  .fx-input::placeholder{ color:var(--on-paper-muted); font-weight:500; font-size:15px; }
  .fx-quick{ display:flex; flex-wrap:wrap; gap:7px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line-on-paper); }
  .fx-preset{ padding:8px 13px; border-radius:var(--r-pill); border:none; background:rgba(68,66,65,.06); font-family:inherit; font-size:11.5px; font-weight:700; color:var(--on-paper); cursor:pointer; letter-spacing:.2px; }
  .fx-preset:active{ transform:scale(.97); }
  .fx-results{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
  .fx-result{ text-align:center; padding:12px 8px; border-radius:var(--r-sm); background:rgba(68,66,65,.04); }
  .fx-result-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.5; }
  .fx-result-val{ font-size:16px; font-weight:800; margin-top:4px; letter-spacing:-.3px; }

  /* ---- packing ---- */
  .pack-progress{ background:var(--paper); border-radius:var(--r-tile); padding:16px 18px; margin-bottom:14px; box-shadow:var(--shadow); }
  .pack-progress-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .pack-progress-head b{ font-size:14px; }
  .pack-progress-head span{ font-size:12px; color:var(--on-paper-muted); font-weight:600; }
  .pack-bar{ height:8px; border-radius:var(--r-pill); background:rgba(68,66,65,.08); overflow:hidden; }
  .pack-bar-fill{ height:100%; border-radius:var(--r-pill); background:var(--red); transition:width .25s ease; }
  .pack-reset{ font-size:11px; font-weight:700; color:var(--on-paper-muted); background:none; border:none; cursor:pointer; font-family:inherit; text-transform:uppercase; letter-spacing:.3px; padding:4px 0; margin-top:8px; opacity:.6; }
  .check-row{ display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--r-sm); margin-bottom:8px; background:var(--paper); box-shadow:var(--shadow); cursor:pointer; user-select:none; }
  .check-row.checked{ opacity:.55; }
  .check-row.checked .check-label{ text-decoration:line-through; }
  .check-box{ width:24px; height:24px; border-radius:8px; border:2px solid rgba(68,66,65,.2); display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s, border-color .15s; }
  .check-row.checked .check-box{ background:var(--red); border-color:var(--red); color:var(--on-red); }
  .check-box .msy{ font-size:16px; opacity:0; }
  .check-row.checked .check-box .msy{ opacity:1; }
  .check-label{ font-size:14px; font-weight:600; flex:1; }

  /* ---- open days ---- */
  .open-day-card{ margin-bottom:16px; }
  .open-day-header{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .open-day-header .date-main{ opacity:1; font-size:13px; }
  .option-card{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-radius:var(--r-sm); margin-bottom:8px; background:rgba(68,66,65,.04); cursor:pointer; border:2px solid transparent; transition:border-color .15s, background .15s; }
  .option-card.picked{ border-color:var(--red); background:rgba(213,56,42,.06); }
  .option-info{ flex:1; min-width:0; }
  .option-name{ font-size:14px; font-weight:700; }
  .option-meta{ font-size:11.5px; color:var(--on-paper-muted); margin-top:2px; font-weight:500; }
  .pick-btn{ padding:8px 14px; border-radius:var(--r-pill); border:none; background:var(--ink); color:var(--on-ink); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; cursor:pointer; font-family:inherit; white-space:nowrap; flex-shrink:0; }
  .option-card.picked .pick-btn{ background:var(--red); color:var(--on-red); }
  .picked-badge{ font-size:10.5px; padding:5px 10px 5px 8px; border-radius:var(--r-pill); font-weight:700; background:var(--red); color:var(--on-red); display:inline-flex; align-items:center; gap:3px; text-transform:uppercase; letter-spacing:.3px; line-height:1; }
  .picked-badge .msy{ font-size:13px; }

  /* ---- day notes ---- */
  .note-indicator{ font-size:16px; color:var(--red); margin-left:4px; vertical-align:middle; }
  .day-notes-section{ margin-top:12px; border-top:1px solid var(--line-on-paper); padding-top:12px; }
  .day-notes-toggle{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; background:none; border:none; cursor:pointer; font-family:inherit; color:inherit; text-align:left; padding:0; }
  .day-notes-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; font-weight:700; opacity:.5; display:flex; align-items:center; gap:5px; }
  .day-notes-input{ width:100%; margin-top:8px; padding:12px 14px; border-radius:var(--r-sm); border:1px solid var(--line-on-paper); background:rgba(68,66,65,.03); font-family:inherit; font-size:13px; font-weight:500; color:var(--on-paper); resize:vertical; min-height:60px; outline:none; }
  .day-notes-input:focus{ border-color:rgba(213,56,42,.3); background:var(--paper); }
  .day-notes-input::placeholder{ color:var(--on-paper-muted); }
  .notes-list-card{ margin-bottom:12px; }
  .notes-list-preview{ font-size:13px; line-height:1.5; margin-top:8px; opacity:.75; font-weight:500; }
  .notes-jump{ font-size:11px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:.3px; margin-top:8px; display:inline-flex; align-items:center; gap:4px; cursor:pointer; background:none; border:none; font-family:inherit; padding:0; }

  /* ---- tabi places ---- */
  .tabi-stats{ font-size:12.5px; font-weight:600; color:var(--on-paper-muted); margin:2px 2px 12px; }
  .tabi-tools{ display:flex; gap:8px; margin:0 0 10px; flex-wrap:wrap; }
  .tabi-tools select{
    flex:1; min-width:0; height:44px; border:none; border-radius:var(--r-pill); background:var(--paper); color:var(--on-paper);
    box-shadow:var(--shadow); padding:0 14px; font-family:inherit; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
  }
  .tabi-count{ font-size:11.5px; font-weight:700; color:var(--on-paper-muted); text-transform:uppercase; letter-spacing:.3px; margin:4px 2px 12px; }
  .tabi-active{ display:flex; flex-wrap:wrap; gap:7px; margin:0 0 10px; }
  .tabi-active:empty{ display:none; }
  .tabi-active button{
    height:28px; padding:0 10px; border:0; border-radius:var(--r-pill); background:var(--red); color:var(--on-red);
    font:700 11px/1 'Figtree',sans-serif; letter-spacing:.3px; text-transform:uppercase; display:inline-flex; align-items:center; gap:4px; cursor:pointer;
  }
  .tabi-fpanel{
    background:var(--paper); border-radius:var(--r-tile); box-shadow:var(--shadow); padding:16px; margin-bottom:12px;
    display:flex; flex-direction:column; gap:14px; max-height:55vh; overflow:auto;
  }
  .tabi-fpanel[hidden]{ display:none !important; }
  .tabi-fpanel h4{ margin:0 0 8px; font-size:10.5px; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:var(--on-paper-muted); }
  .tabi-fchips{ display:flex; flex-wrap:wrap; gap:7px; }
  .tabi-fc{
    height:32px; padding:0 12px; border-radius:var(--r-pill); border:1px solid rgba(68,66,65,.12); background:var(--paper);
    color:var(--on-paper); font:700 11.5px/1 'Figtree',sans-serif; letter-spacing:.2px; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  }
  .tabi-fc .n{ opacity:.45; font-weight:600; }
  .tabi-fc[aria-pressed=true]{ background:var(--red); color:var(--on-red); border-color:transparent; }
  .tabi-fc.cat{ font-weight:800; }
  .tabi-factions{ display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .tabi-factions .note{ font-size:11.5px; font-weight:500; color:var(--on-paper-muted); line-height:1.4; }
  .tabi-clear{ border:0; background:none; color:var(--red); font:700 11px/1 'Figtree',sans-serif; text-transform:uppercase; letter-spacing:.3px; cursor:pointer; padding:4px 0; white-space:nowrap; }
  .tabi-group{ margin-bottom:18px; }
  .tabi-group h3{
    display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--on-paper-muted); margin:22px 2px 12px;
  }
  .tabi-group:first-child h3{ margin-top:6px; }
  .tabi-group h3 span{
    font-size:11px; font-weight:700; background:rgba(68,66,65,.08); color:var(--on-paper); border-radius:var(--r-pill); padding:4px 10px;
  }
  .tabi-place{
    background:var(--paper); border-radius:var(--r-tile); box-shadow:var(--shadow);
    padding:18px 18px 16px; margin-bottom:12px;
    display:flex; flex-direction:column; gap:14px;
  }
  .tabi-place.done{ opacity:.6; }
  .tabi-place.done .tabi-name{ text-decoration:line-through; }
  .tabi-place-top{ display:flex; gap:14px; align-items:flex-start; }
  .tabi-check{
    width:44px; height:44px; border-radius:14px; border:2px solid rgba(68,66,65,.18); background:rgba(68,66,65,.03);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; color:var(--on-red);
  }
  .tabi-check .msy{ font-size:22px; opacity:0; }
  .tabi-place.done .tabi-check{ background:var(--red); border-color:var(--red); }
  .tabi-place.done .tabi-check .msy{ opacity:1; }
  .tabi-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; padding-top:2px; }
  .tabi-name{ font-size:17px; font-weight:800; letter-spacing:-.25px; line-height:1.3; color:var(--on-paper); }
  .tabi-meta{ font-size:13.5px; font-weight:600; color:rgba(68,66,65,.72); line-height:1.45; }
  .tabi-addr,.tabi-note{ font-size:13px; font-weight:500; color:rgba(68,66,65,.65); line-height:1.45; }
  .tabi-note{ color:var(--on-paper); font-weight:600; }
  .tabi-closed{
    display:inline-flex; margin-left:6px; padding:3px 9px; border-radius:var(--r-pill);
    background:var(--red); color:var(--on-red); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; vertical-align:1px;
  }
  .tabi-tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
  .tabi-tag{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
    padding:7px 12px 7px 10px; border-radius:var(--r-pill); background:rgba(68,66,65,.06); color:var(--on-paper); min-height:32px;
  }
  .tabi-tag .msy{ font-size:15px; }
  .tabi-tag.sub{ background:transparent; box-shadow:inset 0 0 0 1.5px currentColor; opacity:.9; }
  .tabi-tag.area{ background:var(--ink); color:var(--on-ink); }
  .tabi-tag.k-coffee{ background:#F3E4D0; color:#8A5314; }
  .tabi-tag.k-food{ background:#F8DDD8; color:#B03024; }
  .tabi-tag.k-shop{ background:#DCE6F8; color:#2F5AA8; }
  .tabi-tag.k-fashion{ background:#EEDFF5; color:#8A3AA8; }
  .tabi-tag.k-books{ background:#DCEFE3; color:#1F7A42; }
  .tabi-tag.k-museum{ background:#E2E0F7; color:#4B43B0; }
  .tabi-tag.k-places{ background:#F6DDE8; color:#B03068; }
  .tabi-tag.k-must{ background:#F6E8C2; color:#9A6A00; }
  .tabi-tag.k-all{ background:rgba(68,66,65,.08); color:var(--on-paper); }
  .tabi-tag.sub.k-coffee{ background:transparent; color:#8A5314; }
  .tabi-tag.sub.k-food{ background:transparent; color:#B03024; }
  .tabi-tag.sub.k-shop{ background:transparent; color:#2F5AA8; }
  .tabi-tag.sub.k-fashion{ background:transparent; color:#8A3AA8; }
  .tabi-tag.sub.k-books{ background:transparent; color:#1F7A42; }
  .tabi-tag.sub.k-museum{ background:transparent; color:#4B43B0; }
  .tabi-tag.sub.k-places{ background:transparent; color:#B03068; }
  .tabi-tag.sub.k-must{ background:transparent; color:#9A6A00; }
  .tabi-tag.sub.k-all{ background:transparent; color:var(--on-paper); }
  .tabi-acts{ display:flex; gap:8px; padding-top:2px; border-top:1px solid var(--line-on-paper); }
  .tabi-acts .btn{ flex:1; padding:13px 16px; font-size:12.5px; min-height:44px; }
  .tabi-loading,.tabi-error{ text-align:center; padding:48px 16px; color:var(--on-paper-muted); font-weight:600; }
  .tabi-error{ color:var(--red); }
  .tabi-mode{
    display:flex; gap:4px; background:var(--paper); border-radius:var(--r-pill); padding:5px; box-shadow:var(--shadow);
    margin:0 0 12px; width:fit-content; max-width:100%;
  }
  .tabi-mode-btn{
    border:0; background:transparent; color:var(--on-paper-muted); border-radius:var(--r-pill); padding:10px 16px;
    font:700 12px/1 'Figtree',sans-serif; text-transform:uppercase; letter-spacing:.3px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tabi-mode-btn .msy{ font-size:18px; }
  .tabi-mode-btn.active{ background:var(--red); color:var(--on-red); }
  .tabi-map-pane{ display:none; }
  .view-tabi-map .tabi-list-pane{ display:none; }
  .view-tabi-map .tabi-map-pane{ display:block; }
  .view-tabi-map .tabi-tools-listonly{ display:none; }
  .tabi-map-note{
    font-size:12px; font-weight:600; color:var(--on-paper-muted); line-height:1.45; margin:0 2px 10px;
  }
  .tabi-map-shell{
    position:relative; height:min(62vh, 560px); min-height:360px; border-radius:var(--r-tile); overflow:hidden;
    box-shadow:var(--shadow); background:var(--paper);
  }
  #tabiMap{ width:100%; height:100%; }
  .tabi-pin{
    width:28px; height:28px; border-radius:50%; border:2px solid #fff; box-shadow:0 2px 8px rgba(68,66,65,.28);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .tabi-pin .msy{ font-size:15px; color:#fff; font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20; }
  .tabi-pin.done{ opacity:.55; }
  .leaflet-popup-content-wrapper{
    border-radius:18px; box-shadow:0 8px 28px rgba(68,66,65,.16); padding:0; font-family:'Figtree',sans-serif;
  }
  .leaflet-popup-content{ margin:14px 16px 12px; min-width:180px; }
  .tabi-popup-title{ font-size:15px; font-weight:800; line-height:1.3; margin-bottom:4px; color:var(--on-paper); }
  .tabi-popup-meta{ font-size:12.5px; font-weight:600; color:rgba(68,66,65,.7); margin-bottom:10px; line-height:1.4; }
  .tabi-popup-acts{ display:flex; flex-direction:column; gap:8px; }
  .tabi-popup-acts .btn{ min-height:40px; padding:10px 14px; font-size:11.5px; text-decoration:none; }
  .tabi-popup-acts button.btn{ border:none; cursor:pointer; font-family:inherit; width:100%; }
  .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large{
    background:rgba(213,56,42,.18);
  }
  .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div{
    background:var(--red); color:var(--on-red); font-family:'Figtree',sans-serif; font-weight:800;
  }
</style>

<body>
<div class="app">

  <header class="app-header">
    <div class="brand"><span class="msy" aria-hidden="true">flight_takeoff</span> Japan Trip</div>
    <div class="daybadge" id="headerBadge">— / 24</div>
  </header>
  <div class="app-sub">Japan 3.0 · Oct 31 &ndash; Nov 23, 2026</div>

  <main class="view active" id="view-today"></main>

  <main class="view" id="view-itinerary">
    <div class="route" id="routeBar"></div>
    <div class="controls">
      <div class="search-field">
        <span class="msy" aria-hidden="true">search</span>
        <input id="search" type="text" placeholder="Search places, hotels, notes…"/>
      </div>
      <div class="filter-dd" id="filterDd">
        <button type="button" class="filter-btn ripple-host" id="filterBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="msy" aria-hidden="true">tune</span>
          <span id="filterBtnLabel">Filter</span>
          <span class="msy filter-chevron" aria-hidden="true">expand_more</span>
        </button>
        <div class="filter-menu" id="filterMenu" role="listbox"></div>
      </div>
    </div>
    <div id="dayList"></div>
    <div class="empty-state collapse-panel" id="emptyState"><div class="collapse-content"><div class="collapse-inner"><div class="collapse-slide"><span class="msy" aria-hidden="true">search_off</span>No days match your search/filter.</div></div></div></div>
  </main>

  <main class="view" id="view-tabi">
    <div class="tabi-stats" id="tabiStats">Loading places…</div>
    <div class="tabi-mode" id="tabiMode" role="tablist" aria-label="Tabi view">
      <button type="button" class="tabi-mode-btn active ripple-host" data-tabi-mode="list" aria-selected="true">
        <span class="msy" aria-hidden="true">view_list</span>List
      </button>
      <button type="button" class="tabi-mode-btn ripple-host" data-tabi-mode="map" aria-selected="false">
        <span class="msy" aria-hidden="true">map</span>Map
      </button>
    </div>
    <div class="chips-wrap" id="tabiChipsWrap">
      <div class="chips-row" id="tabiRail"></div>
    </div>

const STORAGE = { packing:'japan2026-packing', picks:'japan2026-picks', notes:'japan2026-notes', fx:'japan2026-fx', tabiVisited:'japan2026-tabi-visited' };

function loadState(key, fallback){
  try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveState(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}
(function loadFxCache(){
  const c = loadState(STORAGE.fx, null);
  if(c?.rates){
    ESSENTIALS.fx = c.rates;
    ESSENTIALS.fxQuote = c.quote || ESSENTIALS.fxQuote;
    ESSENTIALS.fxDate = c.date || null;
    ESSENTIALS.fxUpdatedAt = c.updatedAt || null;
  }
})();
function getPackingState(){ return loadState(STORAGE.packing, {}); }
function getPicks(){ return loadState(STORAGE.picks, {}); }
function getNotes(){ return loadState(STORAGE.notes, {}); }
function getNote(day){ return getNotes()[day] || ''; }
function hasNote(day){ return !!getNote(day); }
function packingId(cat, item){ return cat.toLowerCase().replace(/[^a-z0-9]+/g,'-') + '-' + item.toLowerCase().replace(/[^a-z0-9]+/g,'-'); }

function isoToday(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtDate(iso, weekday){ const d=new Date(iso+'T00:00:00'); return weekday.slice(0,3).toUpperCase()+' · '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'}).toUpperCase(); }
function fmtShort(iso){ const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }

function hotelMiniHtml(hotelId){
  if(!hotelId) return '';
  const h = HOTELS[hotelId];
  return `<a class="hotel-mini" target="_blank" rel="noopener" href="${h.booking}">
    <img src="${h.photo}" alt="${h.name}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="ph-fallback">${icon('hotel')}</div>
    <div class="htxt"><b>${h.name}</b><span>${h.area}</span></div>
  </a>`;
}

function tagHtmlFor(t){
  if(t==='open') return `<span class="tag">${icon('pending_actions')}Open</span>`;
  if(t==='trip') return `<span class="tag">${icon('hiking')}Day trip</span>`;
  if(t==='undecided') return `<span class="tag">${icon('help')}TBD</span>`;
  return '';
}

function cardSection(label, content, open){
  open = open !== false;
  return `<div class="collapse-panel card-section${open?' open':''}">
    <button type="button" class="collapse-toggle section-toggle" aria-expanded="${open}">
      <span class="section-label">${label}</span>
      <span class="msy collapse-chevron" aria-hidden="true">expand_more</span>
    </button>
    <div class="collapse-content"><div class="collapse-inner"><div class="collapse-slide">${content}</div></div></div>
  </div>`;
}

function dayCardHtml(d, opts){
  opts = opts || {};
  const theme = 'light';
  const routeParts = [d.start];
  if(d.mid && d.mid !== d.start) routeParts.push(d.mid);
  if(d.end && d.end !== d.mid && d.end !== d.start) routeParts.push(d.end);
  const routeLine = routeParts.join(' <span class="arrow">→</span> ');

  const picks = getPicks();
  const pick = picks[d.day];
  let tagHtml = d.tags.map(tagHtmlFor).join('');
  if(pick) tagHtml += `<span class="picked-badge">${icon('check_circle')}${pick}</span>`;

  const noteIcon = hasNote(d.day) ? `<span class="msy note-indicator" aria-hidden="true" title="Has note">edit_note</span>` : '';

  const placesHtml = d.places.length ? `<div class="places">${d.places.map(p=>
    `<a class="place-link" target="_blank" rel="noopener" href="${mapLink(p.q)}">${icon('place')}${p.label}</a>`
  ).join('')}</div>` : '';

  const noteHtml = d.notes ? `<div class="note-line">${icon('sticky_note_2')}<span>${d.notes}</span></div>` : '';
  const specialHtml = d.special ? `<div class="note-line alert">${icon('priority_high')}<span>${d.special}</span></div>` : '';
  const transportHtml = d.transport ? `<span class="transport-badge">${icon(transportIcon(d.transport))}${d.transport}</span>` : '<span style="opacity:.4">—</span>';
  const contextHtml = d.contextHe ? `<div class="day-context hebrew">${d.contextHe}</div>` : '';

  const showNotes = opts.showNotes !== false;
  const noteVal = getNote(d.day);
  const notesOpen = !!noteVal;
  const notesSection = showNotes ? `
    <div class="day-notes-section collapse-panel${notesOpen?' open':''}" data-day="${d.day}">
      <button type="button" class="day-notes-toggle collapse-toggle" aria-expanded="${notesOpen}">
        <span class="day-notes-label">${icon('edit_note')}Your note</span>
        <span class="msy collapse-chevron" aria-hidden="true">expand_more</span>
      </button>
      <div class="collapse-content">
        <div class="collapse-inner">
          <div class="collapse-slide">
            <textarea class="day-notes-input" data-day="${d.day}" placeholder="Booked Osu for lunch, sent luggage to Shibuya…">${noteVal}</textarea>
          </div>
        </div>
      </div>
    </div>` : '';

  return `<div class="card ${theme}" id="${opts.idPrefix||'day'}-${d.day}">
    <div class="card-top">
      <div class="date-main">${fmtDate(d.date, d.weekday)}</div>
      <span class="daynum">DAY ${d.day}${noteIcon}</span>
      <div class="route-line">${routeLine}</div>
      ${tagHtml ? `<div class="tags">${tagHtml}</div>` : ''}
    </div>
    <div class="card-body">
      ${cardSection('Transport', `<div class="value">${transportHtml}</div>`, false)}
      ${cardSection('Activities', `<div class="value"><div class="en">${d.activityEn}</div>${d.activityHe? `<div class="he hebrew">${d.activityHe}</div>`:''}${placesHtml}</div>`)}
      ${cardSection('Hotel', `<div class="value">${hotelMiniHtml(d.hotel) || '<span style="opacity:.4">—</span>'}</div>`)}
    </div>
    ${contextHtml}${specialHtml}${noteHtml}${notesSection}
  </div>`;
}

/* ---------- TODAY VIEW ---------- */
let todayOffset = 0;
function findTodayIndex(){
  const t = isoToday();
  for(let i=0;i<DAYS.length;i++){ if(DAYS[i].date === t) return i; }
  return -1;
}
function renderToday(){
  const container = document.getElementById('view-today');
  const t = isoToday();
  const idx = findTodayIndex();

  if(idx === -1){
    if(t < DAYS[0].date){
      const diff = Math.round((new Date(DAYS[0].date) - new Date(t)) / 86400000);
      container.innerHTML = `
        <div class="bento" style="margin-top:12px">
          <div class="tile ink t-c4">
            <div class="eyebrow">${icon('hourglass_top')}Countdown</div>
            <div class="countdown-num">${diff}</div>
            <div class="caption">day${diff===1?'':'s'} until departure</div>
          </div>
        </div>
        <div class="section-title">${icon('flag')}First up</div>
        ${dayCardHtml(DAYS[0], {idPrefix:'today-preview'})}
      `;
    } else {
      container.innerHTML = `
        <div class="bento" style="margin-top:12px">
          <div class="tile dark t-c4" style="text-align:center; align-items:center;">
            <div class="eyebrow" style="justify-content:center">${icon('celebration')}Welcome home</div>
            <div class="big">TRIP COMPLETE</div>
            <div class="caption">Tap "Plan" to look back on the trip.</div>
          </div>
        </div>
      `;
    }
    return;
  }

  const i = Math.min(Math.max(idx + todayOffset, 0), DAYS.length-1);
  const d = DAYS[i];
  const isReallyToday = (i === idx && todayOffset === 0);
  const label = isReallyToday ? 'Today' : (i < idx ? 'Looking back' : 'Looking ahead');
  const labelIcon = isReallyToday ? 'today' : (i < idx ? 'history' : 'update');

  container.innerHTML = `
    <div class="bento" style="margin-top:12px">
      <div class="tile dark t-c2">
        <div class="eyebrow">${icon(labelIcon)}${label}</div>
        <div class="big sm">${fmtDate(d.date, d.weekday)}</div>
      </div>
      <div class="tile ink t-c2">
        <div class="eyebrow">Day</div>
        <div class="big">${d.day}<span style="font-size:16px;opacity:.7">/${DAYS.length}</span></div>
      </div>
    </div>
    ${dayCardHtml(d, {idPrefix:'today-card'})}
    <div class="nav-arrows">
      <button class="nav-btn ripple-host" id="prevDayBtn" ${i<=0?'disabled':''}>${icon('arrow_back')}Prev</button>
      <button class="nav-btn ripple-host" id="nextDayBtn" ${i>=DAYS.length-1?'disabled':''}>Next${icon('arrow_forward')}</button>
    </div>
  `;
  document.getElementById('prevDayBtn')?.addEventListener('click', ()=>{ todayOffset--; renderToday(); });
  document.getElementById('nextDayBtn')?.addEventListener('click', ()=>{ todayOffset++; renderToday(); });
  bindDayNotes();
}

}

/* ---------- ITINERARY VIEW ---------- */
function renderRouteBar(){
  const legs = []; let last=null;
  DAYS.forEach(d=>{
    if(!last || last.key !== d.region){ legs.push({key:d.region, label:REGION_LABEL[d.region], count:1, firstDay:d.day}); last=legs[legs.length-1]; }
    else last.count++;
  });

const FX_META = {
  JPY:{ symbol:'¥', label:'Yen', decimals:0 },
  USD:{ symbol:'$', label:'Dollar', decimals:2 },
  ILS:{ symbol:'₪', label:'Shekel', decimals:2 },
};

function fxToJpy(amount, cur){
  if(cur === 'JPY') return amount;
  return amount * ESSENTIALS.fx[cur];
}
function fxFromJpy(jpy, cur){
  if(cur === 'JPY') return jpy;
  return jpy / ESSENTIALS.fx[cur];
}
function fmtFx(amount, cur){
  const d = FX_META[cur].decimals;
  const n = amount.toFixed(d);
  return d === 0 ? Number(n).toLocaleString() : Number(n).toLocaleString(undefined, { minimumFractionDigits:d, maximumFractionDigits:d });
}

function fxHintText(){
  const ils = ESSENTIALS.fxQuote?.ILS ?? (1 / ESSENTIALS.fx.ILS);
  const usd = ESSENTIALS.fxQuote?.USD ?? (1 / ESSENTIALS.fx.USD);
  const updated = ESSENTIALS.fxUpdatedAt || ESSENTIALS.fxDate;
  const time = updated ? `Updated ${updated}` : 'Offline · last cached rates';
  return `JPY/ILS ${ils.toFixed(4)} · 1¥ = $${usd.toFixed(4)} · ${time}`;
}

function setFxRates(usdPerYen, ilsPerYen, updatedAt){
  ESSENTIALS.fxQuote = { USD: usdPerYen, ILS: ilsPerYen };
  ESSENTIALS.fx = { USD: 1 / usdPerYen, ILS: 1 / ilsPerYen };
  ESSENTIALS.fxUpdatedAt = updatedAt;
  ESSENTIALS.fxDate = updatedAt;
  saveState(STORAGE.fx, { rates: ESSENTIALS.fx, quote: ESSENTIALS.fxQuote, updatedAt, date: updatedAt });
}

async function fetchFxFromErApi(){
  const res = await fetch('https://open.er-api.com/v6/latest/JPY');
  if(!res.ok) return false;
  const data = await res.json();
  const usd = data.rates?.USD, ils = data.rates?.ILS;
  if(data.result !== 'success' || !usd || !ils) return false;
  setFxRates(usd, ils, data.time_last_update_utc || null);
  return true;
}

async function fetchFxFromFrankfurter(){
  const res = await fetch('https://api.frankfurter.app/latest?from=JPY&to=USD,ILS');
  if(!res.ok) return false;
  const data = await res.json();
  const usd = data.rates?.USD, ils = data.rates?.ILS;
  if(!usd || !ils) return false;
  setFxRates(usd, ils, data.date ? `${data.date} (ECB)` : null);
  return true;
}

async function fetchFxRates(){
  try{
    if(await fetchFxFromErApi()) return true;
    return await fetchFxFromFrankfurter();
  }catch(e){ return false; }
}

const FX_GOOGLE_URL = 'https://www.google.com/finance/quote/JPY-ILS';
const FX_REFRESH_MS = 15 * 60 * 1000;
let fxRefreshTimer = null;

function stopFxLiveRefresh(){
  if(fxRefreshTimer){ clearInterval(fxRefreshTimer); fxRefreshTimer = null; }
  document.removeEventListener('visibilitychange', onFxVisibility);
}

function onFxVisibility(){
  if(document.visibilityState === 'visible' && essentialsSection === 'money') refreshFxRates(false);
}

function startFxLiveRefresh(){
  stopFxLiveRefresh();
  refreshFxRates(false);
  fxRefreshTimer = setInterval(()=>{
    if(essentialsSection === 'money') refreshFxRates(false);
  }, FX_REFRESH_MS);
  document.addEventListener('visibilitychange', onFxVisibility);
}

async function refreshFxRates(manual){
  const btn = document.getElementById('fxRefresh');
  const hint = document.querySelector('.fx-calc-hint');
  if(btn) btn.classList.add('loading');
  if(hint && manual) hint.textContent = 'Fetching live rates…';
  const ok = await fetchFxRates();
  if(btn) btn.classList.remove('loading');
  if(ok) refreshFxDisplay();
  else if(hint && manual) hint.textContent = fxHintText() + ' · refresh failed, using cache';
}

function refreshFxDisplay(){
  const hint = document.querySelector('.fx-calc-hint');
  if(hint) hint.textContent = fxHintText();
  for(const inp of document.querySelectorAll('[data-fx-input]')){
    if(inp.value){ updateFx(inp.dataset.fxInput, inp.value); break; }
  }
}

let fxUpdating = false;
function updateFx(fromCur, rawVal){
  if(fxUpdating) return;
  fxUpdating = true;
  const val = parseFloat(String(rawVal).replace(/,/g,'')) || 0;
  const jpy = fxToJpy(val, fromCur);
  ['JPY','USD','ILS'].forEach(cur=>{
    const out = document.querySelector(`[data-fx-out="${cur}"]`);
    const inp = document.querySelector(`[data-fx-input="${cur}"]`);
    const converted = fxFromJpy(jpy, cur);
    if(out) out.textContent = val === 0 ? '—' : fmtFx(converted, cur);
    if(inp && cur !== fromCur) inp.value = val === 0 ? '' : fmtFx(converted, cur);
    else if(inp && cur === fromCur && val !== 0) inp.value = rawVal;
  });
  fxUpdating = false;
}

function bindFxCalc(){
  const calc = document.getElementById('fxCalc');
  if(!calc || calc.dataset.bound) return;
  calc.dataset.bound = '1';
  calc.querySelectorAll('[data-fx-input]').forEach(inp=>{
    inp.addEventListener('focus', ()=> inp.closest('.fx-input-wrap')?.classList.add('focused'));
    inp.addEventListener('blur', ()=> inp.closest('.fx-input-wrap')?.classList.remove('focused'));
    inp.addEventListener('input', ()=> updateFx(inp.dataset.fxInput, inp.value));
  });
  calc.querySelectorAll('.fx-preset').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cur = btn.dataset.fxCur;
      const amt = btn.dataset.fxPreset;
      const inp = calc.querySelector(`[data-fx-input="${cur}"]`);
      if(inp){ inp.value = amt; updateFx(cur, amt); }
    });
  });
  document.getElementById('fxRefresh')?.addEventListener('click', ()=> refreshFxRates(true));
}
