function tabiEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getTabiVisited(){ return loadState(STORAGE.tabiVisited, {}); }
function saveTabiVisited(map){ saveState(STORAGE.tabiVisited, map); }
function applyTabiVisited(places){
  const visited = getTabiVisited();
  places.forEach(p => { p.visited = !!visited[p.id]; });
}
function tabiCatOf(p){
  const t = (p.type || '').toLowerCase();
  if(t){
    if(/museum|gallery|art studio|art center/.test(t)) return 'Museum/Gallery';
    if(/book|magazine|library|comic/.test(t)) return 'Books';
    if(/clothing|apparel|boutique|sportswear|shoe|accessories|youth|outdoor/.test(t) && !/phone/.test(t)) return 'Fashion';
    if(/^(cafe|coffee|tea)\b/.test(t)) return 'Coffee';
    if(/restaurant|izakaya|yakitori|ramen|udon|sushi|tofu|dumpling|curry|vegan|karaoke|sweets|sandwich|chicken|yakiniku|tempura|noodle|cracker|authentic japanese|korean/.test(t) && !/supply/.test(t)) return 'Japanese food';
    if(/\bstation\b|temple|shrine|castle|viewpoint|tourist|landmark|\bpark\b|beach|island|lake|river|bridge|mountain|onsen|ropeway|garden|trail|memorial|\bmarket\b|^area$|cemetery|amusement|theme|cultural|transport|bus stop|airport|playground|convention|hotel|bike rental|arcade/.test(t)) return 'Places';
    if(/mall|shop|store|street|shopping|department|general|dollar|discount|center|complex|supermarket/.test(t)) return 'Shop';
  }
  return TABI_LIST_CAT[p.list] || 'Shop';
}
function tabiSubOf(p, cat){
  const t = (p.type || '').toLowerCase(), n = (p.title || '').toLowerCase(), x = t + ' ' + n;
  if(cat === 'Coffee'){
    if(/tea/.test(t)) return 'Tea';
    if(/bakery|pastry|cream puff/.test(x)) return 'Bakery & sweets';
    if(/roaster/.test(x)) return 'Roaster';
    return 'Cafe & coffee';
  }
  if(cat === 'Japanese food'){
    if(/sushi/.test(t) || /sushi/.test(x)) return 'Sushi';
    if(/gyoza|dumpling/.test(x)) return 'Gyoza & dumplings';
    if(/katsu/.test(x)) return 'Tonkatsu';
    if(/ramen|udon|soba|noodle|menya/.test(x)) return 'Noodles';
    if(/izakaya|yakitori|yakiniku|karaoke|chicken/.test(t)) return 'Izakaya & grill';
    if(/curry/.test(x)) return 'Curry';
    if(/tofu/.test(x)) return 'Tofu';
    if(/vegan/.test(x)) return 'Vegan';
    if(/sweets|dessert|cracker/.test(t)) return 'Sweets';
    return 'Other restaurant';
  }
  if(cat === 'Shop'){
    if(/mall|department|complex/.test(t)) return 'Malls & department stores';
    if(/shopping area|street/.test(t)) return 'Shopping streets';
    if(/toy|hobby|collectibles|video game/.test(t)) return 'Toys & hobby';
    if(/homeware|kitchenware|glassware|ceramics|pottery|restaurant supply/.test(t)) return 'Home & kitchen';
    if(/dollar|discount|general|convenience|supermarket|grocery/.test(t)) return 'General & discount';
    if(/electronics|watch|camera/.test(t)) return 'Electronics & watches';
    if(/record|second-hand|antique|flea/.test(t)) return 'Records & second-hand';
    if(/perfume|optician|jewelry|luggage|photo|cosmetic/.test(t)) return 'Beauty & lifestyle';
    if(/gift|souvenir|handicraft|craft|stationery/.test(t)) return 'Crafts & gifts';
    return 'Other shops';
  }
  if(cat === 'Fashion'){
    if(/second-hand|vintage/.test(t)) return 'Second-hand & vintage';
    if(/shoe|accessories/.test(t)) return 'Shoes & accessories';
    if(/sport|outdoor|apparel/.test(t)) return 'Sports & outdoor';
    return 'Clothing';
  }
  if(cat === 'Books'){
    if(/used|rare/.test(t)) return 'Used & rare';
    if(/magazine|comic/.test(t)) return 'Magazines & comics';
    if(/library|wholesaler/.test(t)) return 'Library & other';
    return 'Bookstores';
  }
  if(cat === 'Museum/Gallery') return /museum/.test(t) ? 'Museums' : 'Galleries & art spaces';
  if(/temple|shrine/.test(t)) return 'Temples & shrines';
  if(/castle|landmark|historic|memorial|cemetery/.test(t)) return 'Castles & landmarks';
  if(/viewpoint|mountain|lake|river|beach|island|garden|park|onsen|ropeway|bridge|trail/.test(t) && !/amusement|theme/.test(t)) return 'Nature & views';
  if(/station|transport|bus stop|airport|bike/.test(t)) return 'Stations & transport';
  if(/market|flea/.test(t)) return 'Markets';
  if(/arcade|amusement|theme|playground/.test(t)) return 'Entertainment';
  return 'Areas & sights';
}
function tabiClassify(p){ const c = tabiCatOf(p); return [c, tabiSubOf(p, c)]; }
function tabiMeta(p){
  const a = [];
  if(p.rating) a.push(p.rating.toFixed(1) + ' ★ (' + Number(p.reviews || 0).toLocaleString() + ')');
  if(p.type) a.push(p.type);
  if(p.price) a.push(p.price);
  return a.join(' · ');
}
function tabiMapUrl(p){
  if(p.pid) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.title) + '&query_place_id=' + encodeURIComponent(p.pid);
  if(p.url) return p.url;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.title + (p.addr ? ' ' + p.addr : '') + (p.area && p.area !== TABI_UN ? ' ' + p.area : '') + ' Japan');
}
function tabiNk(o){ return Object.keys(o).length; }
function tabiFCount(){ return tabiNk(tabiF.areas) + tabiNk(tabiF.cats) + tabiNk(tabiF.subs) + (tabiF.min ? 1 : 0); }
function tabiFMatch(p){
  if(tabiNk(tabiF.areas) && !tabiF.areas[p.area || TABI_UN]) return false;
  if(tabiNk(tabiF.cats) || tabiNk(tabiF.subs)){
    const cs = tabiClassify(p);
    if(!tabiF.cats[cs[0]] && !tabiF.subs[cs[0] + '|' + cs[1]]) return false;
  }
  if(tabiF.min && (p.rating || 0) < tabiF.min) return false;
  return true;
}
function updateTabiChipsWrap(){
  const wrap = document.getElementById('tabiChipsWrap');
  const row = document.getElementById('tabiRail');
  if(!wrap || !row) return;
  const overflow = row.scrollWidth > row.clientWidth + 2;
  wrap.classList.toggle('no-overflow', !overflow);
  wrap.classList.toggle('scrolled', row.scrollLeft > 4);
  wrap.classList.toggle('at-end', row.scrollLeft + row.clientWidth >= row.scrollWidth - 4);
}
function renderTabiFilters(tcount, scount, acount){
  Object.keys(tabiF.areas).forEach(k => { if(!acount[k]) delete tabiF.areas[k]; });
  Object.keys(tabiF.cats).forEach(k => { if(!tcount[k]) delete tabiF.cats[k]; });
  Object.keys(tabiF.subs).forEach(k => { if(!scount[k]) delete tabiF.subs[k]; });
  const n = tabiFCount();
  const btn = document.getElementById('tabiFilterBtn');
  const label = document.getElementById('tabiFilterBtnLabel');
  if(label) label.textContent = n ? ('Filter · ' + n) : 'Filter';
  if(btn){
    btn.classList.toggle('has-filter', n > 0 || tabiFOpen);
    btn.setAttribute('aria-expanded', String(tabiFOpen));
  }
  const act = [];
  Object.keys(tabiF.areas).forEach(k => act.push(['areas', k, k]));
  Object.keys(tabiF.cats).forEach(k => act.push(['cats', k, k]));
  Object.keys(tabiF.subs).forEach(k => act.push(['subs', k, k.split('|')[1]]));
  if(tabiF.min) act.push(['min', '', tabiF.min + '+ stars']);
  document.getElementById('tabiActive').innerHTML = act.map(a =>
    `<button type="button" data-tabi-f="${a[0]}" data-tabi-v="${tabiEsc(a[1])}" aria-label="Remove filter ${tabiEsc(a[2])}">${tabiEsc(a[2])} ×</button>`
  ).join('');
  const panel = document.getElementById('tabiFpanel');
  panel.hidden = !tabiFOpen;
  if(!tabiFOpen) return;
  const st = panel.scrollTop;
  const anames = Object.keys(acount).sort((a,b) => a === TABI_UN ? 1 : b === TABI_UN ? -1 : a.localeCompare(b));
  const tnames = Object.keys(tcount).sort((a,b) => tcount[b] - tcount[a] || a.localeCompare(b));
  let h = `<div class="tabi-factions"><span class="note">Areas, categories, and rating combine. Choices inside a group match any.</span><button type="button" class="tabi-clear" data-tabi-f="clear">Clear all</button></div>`;
  h += `<div><h4>Area</h4><div class="tabi-fchips">${anames.map(a =>
    `<button type="button" class="tabi-fc" data-tabi-f="areas" data-tabi-v="${tabiEsc(a)}" aria-pressed="${!!tabiF.areas[a]}">${tabiEsc(a)} <span class="n">${acount[a]}</span></button>`
  ).join('')}</div></div>`;
  h += `<div><h4>Category</h4>${tnames.map(c => {
    const subs = Object.keys(scount).filter(k => k.indexOf(c + '|') === 0).sort((a,b) => scount[b] - scount[a] || a.localeCompare(b));
    return `<div class="tabi-fchips" style="margin-bottom:8px"><button type="button" class="tabi-fc cat" data-tabi-f="cats" data-tabi-v="${tabiEsc(c)}" aria-pressed="${!!tabiF.cats[c]}">${tabiEsc(c)} <span class="n">${tcount[c]}</span></button>${
      subs.map(k => `<button type="button" class="tabi-fc" data-tabi-f="subs" data-tabi-v="${tabiEsc(k)}" aria-pressed="${!!tabiF.subs[k]}">${tabiEsc(k.split('|')[1])} <span class="n">${scount[k]}</span></button>`).join('')
    }</div>`;
  }).join('')}</div>`;
  h += `<div><h4>Minimum rating</h4><div class="tabi-fchips">${[0,4,4.5].map(r =>
    `<button type="button" class="tabi-fc" data-tabi-f="min" data-tabi-v="${r}" aria-pressed="${tabiF.min === r}">${r ? r + '+ stars' : 'Any'}</button>`
  ).join('')}</div></div>`;
  panel.innerHTML = h;
  panel.scrollTop = st;
}
function getTabiFilteredItems(){
  const q = document.getElementById('tabiSearch').value.trim().toLowerCase();
  const show = document.getElementById('tabiShow').value;
  return tabiPlaces.filter(p => {
    if(tabiCur !== '__all' && p.list !== tabiCur) return false;
    if(!tabiFMatch(p)) return false;
    if(show === 'todo' && p.visited) return false;
    if(show === 'done' && !p.visited) return false;
    if(q && (p.title + ' ' + (p.note||'') + ' ' + (p.addr||'') + ' ' + p.list + ' ' + (p.type||'') + ' ' + (p.area||'')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}
function tabiHash01(n){
  const x = Math.sin(n * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}
function tabiCoordsFor(p){
  const base = TABI_AREA_COORDS[p.area];
  if(!base) return null;
  const a = tabiHash01(p.id * 17 + 3);
  const b = tabiHash01(p.id * 29 + 7);
  const radius = 0.012;
  return [base[0] + (a - 0.5) * radius * 2, base[1] + (b - 0.5) * radius * 2];
}
function setTabiMode(mode){
  tabiMode = mode === 'map' ? 'map' : 'list';
  const view = document.getElementById('view-tabi');
  view.classList.toggle('view-tabi-map', tabiMode === 'map');
  document.querySelectorAll('[data-tabi-mode]').forEach(btn => {
    const on = btn.dataset.tabiMode === tabiMode;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  renderTabi();
}
function loadScript(src, integrity){
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src;
    el.crossOrigin = '';
    if(integrity) el.integrity = integrity;
    el.onload = () => resolve();
    el.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(el);
  });
}
function loadLeaflet(){
  if(window.L && window.L.markerClusterGroup && window.L.maplibreGL) return Promise.resolve();
  if(tabiLeafletReady) return tabiLeafletReady;
  tabiLeafletReady = loadScript('https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=')
    .then(() => loadScript('https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'))
    .then(() => loadScript('https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.4/leaflet-maplibre-gl.js'))
    .then(() => loadScript('https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'));
  return tabiLeafletReady;
}
function ensureTabiMap(){
  if(tabiMap) return tabiMap;
  tabiMap = L.map('tabiMap', { zoomControl:true, attributionControl:true }).setView([35.68, 138.2], 6);
  L.maplibreGL({
    style: 'https://tiles.openfreemap.org/styles/liberty',
    attribution: '&copy; OpenFreeMap &copy; OpenMapTiles &copy; OpenStreetMap'
  }).addTo(tabiMap);
  tabiCluster = L.markerClusterGroup({ showCoverageOnHover:false, maxClusterRadius:48, spiderfyOnMaxZoom:true });
  tabiMap.addLayer(tabiCluster);
  return tabiMap;
}
function tabiPinIcon(ck, visited){
  const color = TABI_PIN_COLOR[ck] || TABI_PIN_COLOR.all;
  const glyph = TABI_ICON[ck] || TABI_ICON.places;
  return L.divIcon({
    className: '',
    html: `<div class="tabi-pin${visited?' done':''}" style="background:${color}"><span class="msy" aria-hidden="true">${glyph}</span></div>`,
    iconSize: [28, 28],
    iconAnchor: [14, 14],
    popupAnchor: [0, -14]
  });
}
function renderTabiMap(items){
  const note = document.getElementById('tabiMapNote');
  const mappable = [];
  let skipped = 0;
  items.forEach(p => {
    const ll = tabiCoordsFor(p);
    if(!ll){ skipped++; return; }
    mappable.push({ p, ll });
  });
  note.textContent = skipped
    ? `Showing ${mappable.length} pins by area · ${skipped} without a mapped area hidden. Locations are approximate.`
    : `Showing ${mappable.length} pins · locations are approximate by neighborhood/area.`;

  const sig = tabiMode + '|' + mappable.map(x => x.p.id + ':' + (x.p.visited?1:0)).join(',');
  if(sig === tabiMapSig && tabiMap){
    setTimeout(() => { tabiMap.invalidateSize(); }, 50);
    return;
  }
  tabiMapSig = sig;

  loadLeaflet().then(() => {
    ensureTabiMap();
    tabiCluster.clearLayers();
    if(!mappable.length){
      tabiMap.setView([35.68, 138.2], 6);
      setTimeout(() => tabiMap.invalidateSize(), 60);
      return;
    }
    const bounds = [];
    mappable.forEach(({ p, ll }) => {
      const cs = tabiClassify(p);
      const ck = TABI_CAT_KEY[cs[0]] || TABI_LIST_KEY[p.list] || 'places';
      const marker = L.marker(ll, { icon: tabiPinIcon(ck, p.visited), title: p.title });
      const meta = tabiMeta(p);
      marker.bindPopup(`
        <div class="tabi-popup-title">${tabiEsc(p.title)}</div>
        <div class="tabi-popup-meta">${tabiEsc(meta || p.type || p.list)}${p.area ? ' · ' + tabiEsc(p.area) : ''}</div>
        <div class="tabi-popup-acts">
          <a class="btn primary" target="_blank" rel="noopener" href="${tabiEsc(tabiMapUrl(p))}">Open in Maps</a>
          <button type="button" class="btn secondary" data-tabi-vis="${p.id}">${p.visited ? 'Mark unvisited' : 'Mark visited'}</button>
        </div>
      `);
      tabiCluster.addLayer(marker);
      bounds.push(ll);
    });
    tabiMap.fitBounds(bounds, { padding:[28,28], maxZoom:12 });
    setTimeout(() => tabiMap.invalidateSize(), 60);
  }).catch(() => {
    note.textContent = 'Could not load the map library. Check your connection and try again.';
  });
}
function renderTabi(){
  const view = document.getElementById('view-tabi');
  view.classList.toggle('view-tabi-map', tabiMode === 'map');
  if(!tabiPlaces){
    document.getElementById('tabiList').innerHTML = `<div class="tabi-loading">${icon('hourglass_empty')} Loading places…</div>`;
    return;
  }
  applyTabiVisited(tabiPlaces);
  const lists = {};
  tabiPlaces.forEach(p => { lists[p.list] = (lists[p.list] || 0) + 1; });
  const names = Object.keys(lists).sort((a,b) => a.localeCompare(b));
  if(tabiCur !== '__all' && !lists[tabiCur]) tabiCur = '__all';
  document.getElementById('tabiRail').innerHTML =
    `<div class="chip ripple-host${tabiCur==='__all'?' active':''}" data-tabi-list="__all">${icon(TABI_ICON.all)}All <span style="opacity:.55">${tabiPlaces.length}</span></div>` +
    names.map(n => {
      const lk = TABI_LIST_KEY[n] || 'all';
      return `<div class="chip ripple-host${tabiCur===n?' active':''}" data-tabi-list="${tabiEsc(n)}">${icon(TABI_ICON[lk] || TABI_ICON.places)}${tabiEsc(n)} <span style="opacity:.55">${lists[n]}</span></div>`;
    }).join('');
  updateTabiChipsWrap();

  const visited = tabiPlaces.filter(p => p.visited).length;
  document.getElementById('tabiStats').textContent = tabiPlaces.length + ' places · ' + visited + ' visited';

  const sort = document.getElementById('tabiSort').value;
  const gb = document.getElementById('tabiGroup').value;
  const tcount = {}, scount = {}, acount = {};
  tabiPlaces.forEach(p => {
    if(tabiCur !== '__all' && p.list !== tabiCur) return;
    const cs = tabiClassify(p);
    tcount[cs[0]] = (tcount[cs[0]] || 0) + 1;
    const sk = cs[0] + '|' + cs[1];
    scount[sk] = (scount[sk] || 0) + 1;
    const a = p.area || TABI_UN;
    acount[a] = (acount[a] || 0) + 1;
  });
  renderTabiFilters(tcount, scount, acount);

  const items = getTabiFilteredItems();
  document.getElementById('tabiCount').textContent = items.length + ' of ' + tabiPlaces.length + ' places';

  if(tabiMode === 'map'){
    renderTabiMap(items);
    return;
  }

  items.sort((a,b) => {
    if(sort === 'rating') return (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title);
    if(sort === 'added') return (b.t || 0) - (a.t || 0);
    return a.title.localeCompare(b.title);
  });
  if(!items.length){
    document.getElementById('tabiList').innerHTML = `<div class="empty-state open"><div class="collapse-slide">${icon('search_off')}No places match.</div></div>`;
    return;
  }
  const groups = {}, order = [];
  items.forEach(p => {
    let k = '';
    if(gb === 'area') k = p.area || TABI_UN;
    else if(gb === 'list') k = p.list;
    if(!groups[k]){ groups[k] = []; order.push(k); }
    groups[k].push(p);
  });
  order.sort((a,b) => a === TABI_UN ? 1 : b === TABI_UN ? -1 : a.localeCompare(b));
  document.getElementById('tabiList').innerHTML = order.map(k => {
    return `<div class="tabi-group">${k ? `<h3>${tabiEsc(k)} <span>${groups[k].length}</span></h3>` : ''}${groups[k].map(p => {
      const cs = tabiClassify(p);
      const ck = TABI_CAT_KEY[cs[0]] || 'shop';
      const lk = TABI_LIST_KEY[p.list] || 'all';
      const meta = tabiMeta(p);
      const tags =
        `<span class="tabi-tag k-${ck}">${icon(TABI_ICON[ck] || TABI_ICON.shop)}${tabiEsc(cs[0])}</span>` +
        `<span class="tabi-tag sub k-${ck}">${tabiEsc(cs[1])}</span>` +
        (p.area && gb !== 'area' ? `<span class="tabi-tag area">${tabiEsc(p.area)}</span>` : '') +
        (tabiCur === '__all' && p.list !== cs[0] ? `<span class="tabi-tag k-${lk}">${icon(TABI_ICON[lk] || TABI_ICON.places)}${tabiEsc(p.list)}</span>` : '');
      return `<div class="tabi-place${p.visited?' done':''}" data-tabi-id="${p.id}">
        <div class="tabi-place-top">
          <button type="button" class="tabi-check ripple-host" data-tabi-vis="${p.id}" aria-label="Mark visited" aria-pressed="${!!p.visited}">${icon('check')}</button>
          <div class="tabi-body">
            <div class="tabi-name">${tabiEsc(p.title)}</div>
            ${(meta || p.closed) ? `<div class="tabi-meta">${tabiEsc(meta)}${p.closed ? `<span class="tabi-closed">${p.closed === 2 ? 'permanently' : 'temporarily'} closed</span>` : ''}</div>` : ''}
            ${p.addr ? `<div class="tabi-addr">${tabiEsc(p.addr)}</div>` : ''}
            ${p.note ? `<div class="tabi-note">${tabiEsc(p.note)}</div>` : ''}
            <div class="tabi-tags">${tags}</div>
          </div>
        </div>
        <div class="tabi-acts">
          <a class="btn primary ripple-host" target="_blank" rel="noopener" href="${tabiEsc(tabiMapUrl(p))}">${icon('directions')}Open in Maps</a>
        </div>
      </div>`;
    }).join('')}</div>`;
  }).join('');
}
function bindTabiControls(){
  if(tabiBound) return;
  tabiBound = true;
  document.getElementById('tabiSearch').addEventListener('input', renderTabi);
  ['tabiShow','tabiSort','tabiGroup'].forEach(id => document.getElementById(id).addEventListener('change', renderTabi));
  document.getElementById('tabiRail').addEventListener('scroll', updateTabiChipsWrap, { passive:true });
  document.getElementById('tabiFilterBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    tabiFOpen = !tabiFOpen;
    renderTabi();
  });
  document.getElementById('tabiMode').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-tabi-mode]');
    if(!btn) return;
    setTabiMode(btn.dataset.tabiMode);
  });
}
function onTabiFilterAction(f, v){
  if(f === 'clear'){ tabiF = { areas:{}, cats:{}, subs:{}, min:0 }; }
  else if(f === 'min'){ const n = v === '' ? 0 : +v; tabiF.min = n === tabiF.min ? 0 : n; }
  else {
    if(tabiF[f][v]) delete tabiF[f][v];
    else tabiF[f][v] = 1;
  }
  renderTabi();
}
async function ensureTabiLoaded(){
  bindTabiControls();
  if(tabiPlaces || tabiLoading){ renderTabi(); return; }
  tabiLoading = true;
  document.getElementById('tabiStats').textContent = 'Loading places…';
  document.getElementById('tabiList').innerHTML = `<div class="tabi-loading">${icon('hourglass_empty')} Loading places…</div>`;
  try{
    const res = await fetch('./tabi/places-data.json', { cache:'no-cache' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    tabiPlaces = Array.isArray(data.places) ? data.places.slice() : [];
    applyTabiVisited(tabiPlaces);
    tabiLoading = false;
    renderTabi();
  }catch(err){
    tabiLoading = false;
    document.getElementById('tabiStats').textContent = 'Could not load places';
    document.getElementById('tabiList').innerHTML = `<div class="tabi-error">${icon('error')}Failed to load tabi/places-data.json</div>`;
  }
}

/* ---------- TAB SWITCHING ---------- */
function switchTab(tabName){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tabName));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tabName).classList.add('active');
  if(tabName === 'essentials') renderEssentials();
  else stopFxLiveRefresh();
  if(tabName === 'tabi') ensureTabiLoaded();
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=> switchTab(tab.dataset.tab));
});

/* ---------- RIPPLE ---------- */
document.addEventListener('pointerdown', (e)=>{
  const host = e.target.closest('.ripple-host');
  if(!host) return;
  const rect = host.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height);
  const span = document.createElement('span');
  span.className = 'ripple';
  span.style.width = span.style.height = size+'px';
  span.style.left = (e.clientX - rect.left - size/2)+'px';
  span.style.top = (e.clientY - rect.top - size/2)+'px';
  host.appendChild(span);
  span.addEventListener('animationend', ()=>span.remove());
});

/* ---------- INIT ---------- */
renderToday();
renderRouteBar();
renderChips();
renderDays();
renderHotels();
renderEssentials();
applyFilters();
bindDayNotes();

document.getElementById('search').addEventListener('input', applyFilters);
document.addEventListener('click', (e)=>{
  const tabiListChip = e.target.closest('[data-tabi-list]');
  if(tabiListChip){
    tabiCur = tabiListChip.dataset.tabiList;
    renderTabi();
    return;
  }

  const tabiVis = e.target.closest('[data-tabi-vis]');
  if(tabiVis){
    const id = +tabiVis.dataset.tabiVis;
    const visited = getTabiVisited();
    if(visited[id]) delete visited[id];
    else visited[id] = 1;
    saveTabiVisited(visited);
    renderTabi();
    return;
  }

  const tabiFilt = e.target.closest('[data-tabi-f]');
  if(tabiFilt){
    onTabiFilterAction(tabiFilt.dataset.tabiF, tabiFilt.dataset.tabiV || '');
    return;
  }

  if(tabiFOpen && !e.target.closest('#tabiFilterDd') && !e.target.closest('#tabiFpanel') && !e.target.closest('#tabiActive')){
    tabiFOpen = false;
    renderTabi();
  }

  const toggle = e.target.closest('.collapse-toggle');
  if(toggle){
    if(e.target.closest('a')) return;
    e.stopPropagation();
    const panel = toggle.closest('.collapse-panel');
    if(!panel) return;
    const open = panel.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
    return;
  }

  const essChip = e.target.closest('.chip[data-essentials]');
  if(essChip){
    essentialsSection = essChip.dataset.essentials;
    renderEssentials();
    return;
  }

  const packRow = e.target.closest('.check-row[data-pack-id]');
  if(packRow){
    const id = packRow.dataset.packId;
    const state = getPackingState();
    state[id] = !state[id];
    saveState(STORAGE.packing, state);
    renderEssentials();
    return;
  }

  if(e.target.id === 'packReset'){
    saveState(STORAGE.packing, {});
    renderEssentials();
    return;
  }

  const optionCard = e.target.closest('.option-card[data-day]');
  if(optionCard && !e.target.closest('a')){
    const day = +optionCard.dataset.day;
    const dayData = DAYS.find(d => d.day === day);
    if(!dayData) return;
    const options = dayData.places.length ? dayData.places : [{ label: dayData.activityEn }];
    const label = options[+optionCard.dataset.placeIdx]?.label;
    if(!label) return;
    const picks = getPicks();
    if(picks[day] === label) delete picks[day];
    else picks[day] = label;
    saveState(STORAGE.picks, picks);
    renderEssentials();
    refreshDayCards();
    return;
  }

  const gotoDay = e.target.closest('[data-goto-day]');
  if(gotoDay){
    switchTab('itinerary');
    setTimeout(()=> scrollToDay(+gotoDay.dataset.gotoDay), 100);
    return;
  }

  const filterBtn = e.target.closest('#filterBtn');
  if(filterBtn){
    const dd = document.getElementById('filterDd');
    dd.classList.toggle('open');
    updateFilterButton();
    return;
  }

  const opt = e.target.closest('.filter-opt[data-filter]');
  if(opt){
    const f = opt.dataset.filter;
    if(f==='open-only') openOnly = !openOnly;
    else activeFilter = f;
    renderChips();
    document.getElementById('filterDd').classList.remove('open');
    updateFilterButton();
    applyFilters();
    return;
  }

  const dd = document.getElementById('filterDd');
  if(dd?.classList.contains('open') && !e.target.closest('#filterDd')){
    dd.classList.remove('open');
    updateFilterButton();
  }

  const chip = e.target.closest('.chip[data-filter]');
  if(!chip) return;
  const f = chip.dataset.filter;
  if(f==='open-only'){ openOnly = !openOnly; chip.classList.toggle('active', openOnly); }
  else {
    activeFilter = f;
    document.querySelectorAll('.chip[data-filter]').forEach(c=>{ if(c.id!=='openOnly') c.classList.toggle('active', c===chip); });
  }
  applyFilters();
});

(function(){
  const badge = document.getElementById('headerBadge');
  const idx = findTodayIndex();
  if(idx >= 0) badge.textContent = DAYS[idx].day + ' / ' + DAYS.length;
  else if(isoToday() < DAYS[0].date){
    const diff = Math.round((new Date(DAYS[0].date) - new Date(isoToday())) / 86400000);
    badge.textContent = diff + 'd';
  } else badge.textContent = '✓';
})();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
